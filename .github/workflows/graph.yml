name: Update activity graph

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: ${{ github.repository_owner }}
          options: theme=tokyo-night&hide_border=true&area=true&custom_title=Contribution%20graph%20-%20Last%2030%20days
          output_path: profile/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify activity graph
        run: |
          set -euo pipefail
          test -f profile/activity.svg
          echo "Activity graph generated successfully:"
          ls -lh profile/activity.svg

      - name: Commit activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/activity.svg

          if git diff --cached --quiet; then
            echo "No changes to activity graph"
            exit 0
          fi

          git commit -m "Update activity graph"
          git push